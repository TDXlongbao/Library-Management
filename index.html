<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>拾页 · 图书管理</title>
  <style>
    :root{font-family:Inter,"Microsoft YaHei",system-ui,sans-serif;color:#202a25;background:#f5f6f1;font-synthesis:none}*{box-sizing:border-box}body{margin:0}.shell{max-width:1100px;margin:auto;padding:34px 24px 60px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:42px}.brand{font-size:19px;font-weight:750;letter-spacing:.04em}.brand span{color:#56856b}.tag{font-size:13px;color:#718078}.hero{margin-bottom:28px}.eyebrow{color:#59856a;font-size:12px;font-weight:700;letter-spacing:.14em}.hero h1{font-size:38px;margin:8px 0}.hero p{color:#718078;margin:0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:26px 0}.stat,.panel{background:#fff;border:1px solid #e7ebe5;border-radius:14px}.stat{padding:18px 20px}.stat label{font-size:12px;color:#7a857f}.stat strong{display:block;font-size:25px;margin-top:5px}.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px}.search{flex:1;min-width:120px}.field,input,select,textarea{font:inherit}.search input,.form input,.form textarea,.form select{width:100%;border:1px solid #dfe5de;border-radius:9px;padding:11px 12px;background:#fff;color:#202a25;outline:none}.search input:focus,.form input:focus,.form textarea:focus,.form select:focus{border-color:#6e9a7d;box-shadow:0 0 0 3px #6e9a7d22}.button{border:0;border-radius:9px;padding:11px 16px;background:#477657;color:white;font-weight:650;cursor:pointer}.button:hover{background:#356345}.button.secondary{background:#edf2ed;color:#395c44}.button.danger{background:#fff0ed;color:#a34333}.panel{overflow:hidden}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;text-align:left;white-space:nowrap}th{font-size:11px;letter-spacing:.07em;color:#87928b;background:#fafbf9;padding:13px 16px}td{padding:15px 16px;border-top:1px solid #edf0ec;font-size:14px}.book-title{font-weight:650}.muted{color:#829087;font-size:12px;margin-top:4px}.pill{display:inline-block;padding:5px 9px;border-radius:20px;background:#edf4ee;color:#4d7559;font-size:12px}.actions{display:flex;gap:7px}.actions button{padding:7px 10px;font-size:12px}.empty{text-align:center;padding:45px 16px;color:#87928b}.empty strong{display:block;color:#45554b;margin-bottom:6px}.foot{font-size:12px;color:#8b958e;margin-top:14px}.modal{position:fixed;inset:0;background:#17221c66;display:none;align-items:center;justify-content:center;padding:18px}.modal.open{display:flex}.dialog{width:min(520px,100%);background:white;border-radius:16px;padding:24px;box-shadow:0 18px 60px #0002}.dialog h2{margin:0 0 18px}.form{display:grid;grid-template-columns:1fr 1fr;gap:13px}.form label{display:block;font-size:12px;color:#617067;margin-bottom:6px}.form .wide{grid-column:1/-1}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}@media(max-width:620px){.shell{padding:24px 15px}.hero h1{font-size:31px}.stats{gap:8px}.stat{padding:14px 12px}.stat strong{font-size:21px}.top{margin-bottom:30px}.tag{font-size:11px}.toolbar{flex-wrap:wrap}.search{flex-basis:100%}.form{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top"><div class="brand"><span>▰</span> 拾页 <span style="color:#849188;font-weight:500">· LIBRARY</span></div><div class="tag">把喜欢的书，好好收起来</div></header>
    <section class="hero"><div class="eyebrow">PERSONAL LIBRARY</div><h1>我的图书馆</h1><p>记录每一本书，也记录阅读的进度。</p></section>
    <section class="stats"><div class="stat"><label>馆藏总数</label><strong id="total">0</strong></div><div class="stat"><label>正在阅读</label><strong id="reading">0</strong></div><div class="stat"><label>已读完</label><strong id="finished">0</strong></div></section>
    <div class="toolbar"><div class="search"><input id="search" type="search" placeholder="搜索书名、作者或分类…" aria-label="搜索图书"></div><button class="button" id="add">＋ 添加图书</button></div>
    <section class="panel"><div class="table-wrap"><table><thead><tr><th>书籍</th><th>分类</th><th>状态</th><th>评分</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table><div class="empty" id="empty"><strong>书架还是空的</strong>添加第一本书，开始整理你的私人书单。</div></div></section>
    <div class="foot">数据保存在当前浏览器中。清除浏览器数据会一并清除书单。</div>
  </main>
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><form class="dialog" id="bookForm"><h2 id="dialogTitle">添加图书</h2><input type="hidden" id="bookId"><div class="form"><div class="wide"><label for="title">书名 *</label><input id="title" required maxlength="100" placeholder="例如：小王子"></div><div><label for="author">作者</label><input id="author" maxlength="60" placeholder="作者姓名"></div><div><label for="category">分类</label><input id="category" maxlength="30" placeholder="文学、历史…"></div><div><label for="status">阅读状态</label><select id="status"><option>未开始</option><option>正在阅读</option><option>已读完</option></select></div><div><label for="rating">评分</label><select id="rating"><option value="">暂不评分</option><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select></div><div class="wide"><label for="note">笔记</label><textarea id="note" rows="3" maxlength="300" placeholder="一句话记录你的想法…"></textarea></div></div><div class="dialog-actions"><button class="button secondary" type="button" id="cancel">取消</button><button class="button" type="submit">保存图书</button></div></form></div>
  <script>
    const KEY='shiyue-library-v1';
    const sample=[{id:'demo-1',title:'小王子',author:'安托万·德·圣-埃克苏佩里',category:'文学',status:'已读完',rating:'5',note:'重要的东西，用眼睛是看不见的。'},{id:'demo-2',title:'人类简史',author:'尤瓦尔·赫拉利',category:'历史',status:'正在阅读',rating:'',note:''},{id:'demo-3',title:'设计中的设计',author:'原研哉',category:'设计',status:'未开始',rating:'',note:''}];
    let books;try{books=JSON.parse(localStorage.getItem(KEY));if(!Array.isArray(books))books=sample}catch{books=sample}
    const $=id=>document.getElementById(id),escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function save(){localStorage.setItem(KEY,JSON.stringify(books));render()}
    function render(){const q=$('search').value.trim().toLowerCase(),shown=books.filter(b=>[b.title,b.author,b.category].join(' ').toLowerCase().includes(q));$('total').textContent=books.length;$('reading').textContent=books.filter(b=>b.status==='正在阅读').length;$('finished').textContent=books.filter(b=>b.status==='已读完').length;$('empty').style.display=shown.length?'none':'block';$('rows').innerHTML=shown.map(b=>`<tr><td><div class="book-title">${escapeHtml(b.title)}</div><div class="muted">${escapeHtml(b.author||'作者未填写')}${b.note?` · ${escapeHtml(b.note)}`:''}</div></td><td>${escapeHtml(b.category||'—')}</td><td><span class="pill">${escapeHtml(b.status)}</span></td><td>${b.rating?`★ ${escapeHtml(b.rating)}`:'—'}</td><td><div class="actions"><button class="button secondary" data-edit="${escapeHtml(b.id)}">编辑</button><button class="button danger" data-delete="${escapeHtml(b.id)}">删除</button></div></td></tr>`).join('')}
    function open(book){$('bookForm').reset();$('bookId').value=book?.id||'';$('dialogTitle').textContent=book?'编辑图书':'添加图书';if(book)for(const k of ['title','author','category','status','rating','note'])$(k).value=book[k]||'';$('modal').classList.add('open');$('title').focus()}
    $('add').onclick=()=>open();$('cancel').onclick=()=>$('modal').classList.remove('open');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('open')};$('search').oninput=render;
    $('bookForm').onsubmit=e=>{e.preventDefault();const id=$('bookId').value,data={id:id||crypto.randomUUID(),title:$('title').value.trim(),author:$('author').value.trim(),category:$('category').value.trim(),status:$('status').value,rating:$('rating').value,note:$('note').value.trim()};if(id)books=books.map(b=>b.id===id?data:b);else books.unshift(data);save();$('modal').classList.remove('open')};
    $('rows').onclick=e=>{const edit=e.target.closest('[data-edit]'),del=e.target.closest('[data-delete]');if(edit)open(books.find(b=>b.id===edit.dataset.edit));if(del){const book=books.find(b=>b.id===del.dataset.delete);if(confirm(`确定删除《${book.title}》吗？`)){books=books.filter(b=>b.id!==book.id);save()}}};render();
  </script>
</body>
</html>
